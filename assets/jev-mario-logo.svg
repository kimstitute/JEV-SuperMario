<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Jev Mario</title>
  <desc id="desc">A transparent square icon combining a J monogram, a red cap, and a blue game controller.</desc>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff625f"/><stop offset="1" stop-color="#d62443"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55dcff"/><stop offset="1" stop-color="#2384df"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#07101f" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- The canvas is intentionally transparent. All artwork stays inside a square icon footprint. -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="372" height="372" rx="88" fill="none" stroke="#172033" stroke-width="22"/>

    <path d="M128 220v-29c0-58 47-105 105-105h46c58 0 105 47 105 105v29h-72v-25c0-19-15-34-34-34h-44c-19 0-34 15-34 34v25Z" fill="url(#cap)"/>
    <path d="M111 211h290c-18 34-54 57-95 57H206c-41 0-77-23-95-57Z" fill="#f04455"/>
    <path d="M155 188c62 17 133 17 202-2" fill="none" stroke="#ff8580" stroke-width="9" stroke-linecap="round" opacity=".7"/>

    <rect x="221" y="103" width="70" height="70" rx="20" fill="#fff"/>
    <path d="M270 119v22c0 15-8 23-24 23-8 0-15-3-20-8l10-13c3 3 6 5 10 5 5 0 7-3 7-9v-20Z" fill="#d92543"/>

    <path d="M126 304c0-31 25-56 56-56h148c31 0 56 25 56 56v43c0 31-25 56-56 56H182c-31 0-56-25-56-56Z" fill="url(#pad)"/>
    <path d="M158 324h50m-25-25v50" stroke="#122039" stroke-width="14" stroke-linecap="round"/>
    <circle cx="320" cy="315" r="13" fill="#122039"/>
    <circle cx="350" cy="344" r="13" fill="#122039"/>
    <path d="M240 338h32" stroke="#dff8ff" stroke-width="11" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
